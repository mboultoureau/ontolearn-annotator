services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ChangeMe
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: ChangeMe
    ports:
      - "3307:3306"
    volumes:
      - ./data/db:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:3000"
      - "443:3000"
    volumes:
      - ./public:/app/public
    depends_on:
      - db